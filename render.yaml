services:
  - type: web
    name: mediaflow-license-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements-license-server.txt
    startCommand: python license_server.py
    healthCheckPath: /health
    disk:
      name: license-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MEDIA_FLOW_LICENSE_DB
        value: /var/data/licenses.sqlite3
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK_ID
        sync: false
      - key: MEDIA_FLOW_LICENSE_PRIVATE_KEY
        sync: false
      - key: MEDIA_FLOW_SMTP_HOST
        value: smtp.resend.com
      - key: MEDIA_FLOW_SMTP_PORT
        value: "587"
      - key: MEDIA_FLOW_SMTP_USER
        value: resend
      - key: MEDIA_FLOW_SMTP_PASSWORD
        sync: false
      - key: MEDIA_FLOW_EMAIL_FROM
        sync: false
