name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist
          $bin = Get-ChildItem -Path ffmpeg-dist -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe" -Destination ffmpeg.exe
          Copy-Item "$($bin.FullName)\ffprobe.exe" -Destination ffprobe.exe
          New-Item -ItemType Directory -Force -Path ffmpeg-licenses
          Get-ChildItem -Path ffmpeg-dist -Recurse -File -Include LICENSE*,COPYING*,README* | Copy-Item -Destination ffmpeg-licenses -Force

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name media-flow app.py

      - name: Prepare release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\media-flow
          Copy-Item dist\media-flow.exe release\media-flow\
          Copy-Item ffmpeg.exe release\media-flow\
          Copy-Item ffprobe.exe release\media-flow\
          Copy-Item icon-300.png release\media-flow\
          Copy-Item README.md release\media-flow\
          Copy-Item CHANGELOG.md release\media-flow\
          Copy-Item PRIVACY.md release\media-flow\
          Copy-Item THIRD_PARTY_NOTICES.md release\media-flow\
          Copy-Item -Recurse ffmpeg-licenses release\media-flow\
          Compress-Archive -Path release\media-flow -DestinationPath "media-flow-${{ github.ref_name }}-windows.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" installer.iss
          Copy-Item "build\installer\media-flow-setup-$version.exe" "build\installer\media-flow-setup-${{ github.ref_name }}.exe" -Force

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\n## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $match.Value | Set-Content release_notes.md
          } else {
            $content | Set-Content release_notes.md
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            media-flow-${{ github.ref_name }}-windows.zip
            build\installer\media-flow-setup-${{ github.ref_name }}.exe
