name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dist
          $bin = Get-ChildItem -Path ffmpeg-dist -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe" -Destination ffmpeg.exe
          Copy-Item "$($bin.FullName)\ffprobe.exe" -Destination ffprobe.exe

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name youtube-mp3-downloader app.py

      - name: Prepare release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\youtube-mp3-downloader
          Copy-Item dist\youtube-mp3-downloader.exe release\youtube-mp3-downloader\
          Copy-Item ffmpeg.exe release\youtube-mp3-downloader\
          Copy-Item ffprobe.exe release\youtube-mp3-downloader\
          Copy-Item README.md release\youtube-mp3-downloader\
          Copy-Item CHANGELOG.md release\youtube-mp3-downloader\
          Compress-Archive -Path release\youtube-mp3-downloader -DestinationPath "youtube-mp3-downloader-${{ github.ref_name }}-windows.zip"

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\].*?(?=\n## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $match.Value | Set-Content release_notes.md
          } else {
            $content | Set-Content release_notes.md
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: youtube-mp3-downloader-${{ github.ref_name }}-windows.zip
