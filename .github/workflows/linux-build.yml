name: Build Linux App

on:
  push:
    branches:
      - main
      - linux-support
    paths:
      - "app.py"
      - "microsoft_store_pro.py"
      - "requirements.txt"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2t64 xz-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Download static FFmpeg
        run: |
          curl -L --fail --retry 3 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o ffmpeg.tar.xz
          mkdir -p ffmpeg-dist
          tar -xJf ffmpeg.tar.xz -C ffmpeg-dist
          FFMPEG_DIR="$(find ffmpeg-dist -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -n 1)"
          test -n "$FFMPEG_DIR"
          cp "$FFMPEG_DIR/ffmpeg" ffmpeg
          cp "$FFMPEG_DIR/ffprobe" ffprobe
          chmod +x ffmpeg ffprobe
          mkdir -p ffmpeg-licenses
          find "$FFMPEG_DIR" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'README*' \) -exec cp {} ffmpeg-licenses/ \;

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name media-flow \
            --collect-all customtkinter \
            app.py

      - name: Prepare Linux package
        run: |
          mkdir -p release/media-flow
          cp dist/media-flow release/media-flow/
          cp ffmpeg ffprobe release/media-flow/
          cp icon-300.png release/media-flow/ 2>/dev/null || true
          cp README.md CHANGELOG.md PRIVACY.md THIRD_PARTY_NOTICES.md release/media-flow/
          cp -r ffmpeg-licenses release/media-flow/
          cat > release/media-flow/README-LINUX.md <<'EOF'
          # Media Flow para Linux

          ## Requisitos

          - Linux x86_64
          - GTK/X11 o Wayland con Tk disponible

          ## Ejecutar

          Haz ejecutable `media-flow` y ejecútalo. FFmpeg y FFprobe están incluidos en el paquete.

          Media Flow procesa los archivos localmente.
          EOF
          chmod +x release/media-flow/media-flow
          tar -C release -czf "media-flow-linux-x86_64-${GITHUB_SHA::7}.tar.gz" media-flow

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-flow-linux-x86_64
          path: media-flow-linux-x86_64-*.tar.gz
          if-no-files-found: error
