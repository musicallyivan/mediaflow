name: Build Linux App (.deb, .rpm, .tar.gz)

on:
  push:
    branches:
      - main
      - linux-support
    paths:
      - "app.py"
      - "linux_app.py"
      - "microsoft_store_pro.py"
      - "requirements.txt"
      - "packaging/linux/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xz-utils rpm dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Download static FFmpeg
        run: |
          curl -fsSL --retry 3 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -o ffmpeg.tar.xz
          mkdir -p ffmpeg-dist
          tar -xJf ffmpeg.tar.xz -C ffmpeg-dist
          FFMPEG_BIN="$(find ffmpeg-dist -type f -name 'ffmpeg' | head -n 1)"
          FFPROBE_BIN="$(find ffmpeg-dist -type f -name 'ffprobe' | head -n 1)"
          test -n "$FFMPEG_BIN" && test -n "$FFPROBE_BIN"
          cp "$FFMPEG_BIN" ffmpeg
          cp "$FFPROBE_BIN" ffprobe
          chmod +x ffmpeg ffprobe
          mkdir -p ffmpeg-licenses
          find ffmpeg-dist -maxdepth 2 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'README*' \) -exec cp {} ffmpeg-licenses/ \;

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name media-flow \
            --collect-all customtkinter \
            --collect-all PIL \
            --collect-all darkdetect \
            --hidden-import PIL._tkinter_finder \
            --hidden-import PIL.ImageTk \
            --add-data "icon-300.png:." \
            --add-data "assets/icons:assets/icons" \
            linux_app.py

      - name: Build .deb, .rpm and .tar.gz packages
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          chmod +x packaging/linux/build_packages.sh
          bash packaging/linux/build_packages.sh "${VERSION}"

      - name: Upload Linux packages (.deb, .rpm, .tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: media-flow-linux-packages
          path: |
            media-flow_*.deb
            media-flow-*.rpm
            media-flow-*.tar.gz
          if-no-files-found: error
