name: Release Linux

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xz-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Download static FFmpeg
        run: |
          curl -L --fail --retry 3 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o ffmpeg.tar.xz
          mkdir -p ffmpeg-dist
          tar -xJf ffmpeg.tar.xz -C ffmpeg-dist
          FFMPEG_DIR="$(find ffmpeg-dist -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -n 1)"
          test -n "$FFMPEG_DIR"
          cp "$FFMPEG_DIR/ffmpeg" ffmpeg
          cp "$FFMPEG_DIR/ffprobe" ffprobe
          chmod +x ffmpeg ffprobe
          mkdir -p ffmpeg-licenses
          find "$FFMPEG_DIR" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'README*' \) -exec cp {} ffmpeg-licenses/ \;

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name media-flow \
            --collect-all customtkinter \
            app.py

      - name: Prepare release package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release/media-flow
          cp dist/media-flow release/media-flow/
          cp ffmpeg ffprobe release/media-flow/
          cp icon-300.png release/media-flow/ 2>/dev/null || true
          cp README.md CHANGELOG.md PRIVACY.md THIRD_PARTY_NOTICES.md release/media-flow/
          cp -r ffmpeg-licenses release/media-flow/
          cat > release/media-flow/README-LINUX.md <<'EOF'
          # Media Flow para Linux

          Media Flow es una aplicación de escritorio para convertir audio, vídeo e imágenes localmente mediante FFmpeg.

          ## Instalación

          1. Extrae el archivo `.tar.gz`.
          2. Abre una terminal dentro de la carpeta `media-flow`.
          3. Ejecuta `chmod +x media-flow` si fuera necesario.
          4. Ejecuta `./media-flow`.

          FFmpeg y FFprobe ya están incluidos.

          Esta versión está preparada para Linux x86_64.
          EOF
          chmod +x release/media-flow/media-flow
          tar -C release -czf "media-flow-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" media-flow

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: media-flow-${{ github.ref_name }}-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
