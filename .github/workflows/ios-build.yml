name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS App (Native Unsigned)
        run: |
          cd ios-app
          xcodebuild clean build \
            -project MediaFlow.xcodeproj \
            -scheme MediaFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd ios-app
          APP_PATH=$(find build -name "MediaFlow.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MediaFlow.app not found in build directory"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr MediaFlow.ipa Payload
          ls -la MediaFlow.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-iOS-IPA
          path: ios-app/MediaFlow.ipa
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios-app/MediaFlow.ipa
