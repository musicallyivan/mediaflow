plugins {
    id "com.android.application"
}

android {
    namespace "com.musicallyivan.mediaflow"
    compileSdk 35

    defaultConfig {
        applicationId "com.musicallyivan.mediaflow"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def localFfmpegKit = file("libs/ffmpeg-kit-16kb.aar")

    if (localFfmpegKit.exists()) {
        implementation files(localFfmpegKit)
    } else {
        implementation "com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.0.0"
    }
}
