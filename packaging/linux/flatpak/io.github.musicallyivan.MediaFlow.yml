app-id: io.github.musicallyivan.MediaFlow
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: media-flow
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --share=network

modules:
  - name: media-flow
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/media-flow /app/bin
      - cp -r media-flow/* /app/opt/media-flow/
      - chmod +x /app/opt/media-flow/media-flow /app/opt/media-flow/ffmpeg /app/opt/media-flow/ffprobe
      - ln -s /app/opt/media-flow/media-flow /app/bin/media-flow
      - install -Dm644 media-flow.desktop /app/share/applications/io.github.musicallyivan.MediaFlow.desktop
      - sed -i 's|Exec=/usr/bin/media-flow|Exec=media-flow|g; s|Icon=media-flow|Icon=io.github.musicallyivan.MediaFlow|g' /app/share/applications/io.github.musicallyivan.MediaFlow.desktop
      - install -Dm644 io.github.musicallyivan.MediaFlow.metainfo.xml /app/share/metainfo/io.github.musicallyivan.MediaFlow.metainfo.xml
      - install -Dm644 media-flow/icon-300.png /app/share/icons/hicolor/256x256/apps/io.github.musicallyivan.MediaFlow.png
    sources:
      - type: archive
        url: https://github.com/musicallyivan/mediaflow/releases/download/v1.7.8/media-flow-v1.7.8-linux-x86_64.tar.gz
        strip-components: 0
        sha256: REPLACE_WITH_RELEASE_SHA256
      - type: file
        path: ../media-flow.desktop
      - type: file
        path: ../io.github.musicallyivan.MediaFlow.metainfo.xml
